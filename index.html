<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SnDflowerboxponorogo</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="header">

        <img src="logo.png" alt="Logo" class="logo">

        <h1>SnDflowerboxponorogo</h1>

        <p>Abadikan momenmu dengan kami</p>

    </div>

    <form id="orderForm">

        <div class="form-group">

            <label class="required">Nama Pemesan</label>

            <input
                type="text"
                id="nama"
                placeholder="contoh ; SnD"
            >

        </div>

        <div class="form-group">

            <label>Instagram</label>

            <input
                type="text"
                id="instagram"
                placeholder="Contoh ; SnDflowerboxponorogo"
            >

        </div>

        <div class="form-group">

            <label class="required">
                Request Ucapan
            </label>

            <div class="example-box">

                🎓CONGRATULATIONS <br>
                Genara Rengganis Atlalune S.H <br>
                I’m proud of you for never giving up at all <br>
                From : SnD

            </div>

            <textarea id="ucapan"></textarea>

        </div>

        <div class="form-group">

            <label class="required">
                Jenis Papan Bunga
            </label>

            <div class="radio-group">

                <label class="radio-item">
                    <input type="radio" name="jenis" value="Akrilik Bulat Putih">
                    <span>Akrilik Bulat Putih</span>
                </label>

                <label class="radio-item">
                    <input type="radio" name="jenis" value="Akrilik Bulat Hitam">
                    <span>Akrilik Bulat Hitam</span>
                </label>

                <label class="radio-item">
                    <input type="radio" name="jenis" value="Akrilik Kubah Putih">
                    <span>Akrilik Kubah Putih</span>
                </label>

                <label class="radio-item">
                    <input type="radio" name="jenis" value="Akrilik Kubah Hitam">
                    <span>Akrilik Kubah Hitam</span>
                </label>

                <label class="radio-item">
                    <input type="radio" name="jenis" value="Akrilik Ring Besi">
                    <span>Akrilik Ring Besi</span>
                </label>

            </div>

        </div>

        <div class="form-group">

            <label class="required">
                Request Warna Tulisan
            </label>

            <input
                type="text"
                id="warna"
                placeholder="Contoh ; Hitam,Putih,Gold,Pink"
            >

        </div>

        <div class="form-group">

            <label>Selendang</label>

            <div class="checkbox-group">

                <label class="checkbox-item">
                    <input type="radio" name="selendang" value="Pakai">
                    <span>Pakai</span>
                </label>

                <label class="checkbox-item">
                    <input type="radio" name="selendang" value="Tidak">
                    <span>Tidak</span>
                </label>

            </div>

        </div>

        <div class="form-group">

            <label>
                Pilih beberapa opsi warna bunga
            </label>

            <div class="color-options">

                <label class="color-option">
                    <input type="checkbox" value="Merah">
                    <span>Merah</span>
                </label>

                <label class="color-option">
                    <input type="checkbox" value="Pink">
                    <span>Pink</span>
                </label>

                <label class="color-option">
                    <input type="checkbox" value="Biru">
                    <span>Biru</span>
                </label>

                <label class="color-option">
                    <input type="checkbox" value="Ungu">
                    <span>Ungu</span>
                </label>

                <label class="color-option">
                    <input type="checkbox" value="Putih">
                    <span>Putih</span>
                </label>

                <label class="color-option">
                    <input type="checkbox" value="Peach">
                    <span>Peach</span>
                </label>

            </div>

        </div>

        <div class="form-group">

            <label>
                Pilih tanggal dan waktu Pengantaran
            </label>

            <div class="date-time-group">

                <input type="date">

                <input type="time">

            </div>

        </div>

        <div class="form-group">

            <label class="required">
                Alamat Pengantaran / Gedung
            </label>

            <input type="text" id="alamat">

        </div>

        <div class="form-group">

            <label class="required">
                WhatsApp Pemesan
            </label>

            <input type="tel" id="whatsapp">

        </div>

        <div class="button-group">

            <button
                type="button"
                class="btn-preview"
                onclick="previewPesanan()"
            >
                Preview
            </button>

            <button
                type="button"
                class="btn-submit"
                onclick="sendWhatsApp()"
            >
                Kirim WhatsApp
            </button>

        </div>

    </form>

</div>

<!-- MODAL -->

<div class="modal" id="modal">

    <div class="modal-content">

        <h2 style="margin-bottom:20px;">
            Preview Pesanan
        </h2>

        <div id="previewContent"></div>

        <div class="button-group">

            <button
                type="button"
                class="btn-preview"
                onclick="closeModal()"
            >
                Tutup
            </button>

            <button
                type="button"
                class="btn-submit"
                onclick="sendNow()"
            >
                Kirim
            </button>

        </div>

    </div>

</div>

<div class="success-alert" id="successAlert">
    Membuka WhatsApp...
</div>

<script src="script.js"></script>

</body>
</html>
