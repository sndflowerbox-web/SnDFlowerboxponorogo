<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnDflowerboxponorogo</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <!-- HEADER -->

        <div class="header">

            <img src="logo.png" alt="Logo" class="logo">

            <h1>SnDflowerboxponorogo</h1>

            <p>Abadikan momenmu dengan kami</p>

        </div>

        <!-- FORM -->

        <form id="orderForm">

            <!-- NAMA -->

            <div class="form-group">

                <label class="required">
                    Nama Pemesan
                </label>

                <input
                    type="text"
                    id="nama"
                    placeholder="contoh ; SnD"
                >

            </div>

            <!-- INSTAGRAM -->

            <div class="form-group">

                <label>
                    Instagram
                </label>

                <input
                    type="text"
                    id="instagram"
                    placeholder="Contoh ; SnDflowerboxponorogo"
                >

            </div>

            <!-- UCAPAN -->

            <div class="form-group">

                <label class="required">
                    Request Ucapan
                </label>

                <div class="example-box">
                    Contoh :
                    🎓CONGRATULATIONS <br>
                    Genara Rengganis Atlalune S.H <br>
                    I’m proud of you for never giving up at all <br>
                    From : SnD

                </div>

                <textarea
                    id="ucapan"
                    placeholder="Tulis ucapan disini..."
                ></textarea>

            </div>

            <!-- JENIS PAPAN -->

            <div class="form-group">

                <label class="required">
                    Jenis Papan Bunga
                </label>

                <div class="radio-group">

                    <label class="radio-item">
                        <input type="radio" name="jenis" value="Akrilik Bulat Putih">
                        <span>Akrilik Bulat Putih</span>
                    </label>

                    <label class="radio-item">
                        <input type="radio" name="jenis" value="Akrilik Bulat Hitam">
                        <span>Akrilik Bulat Hitam</span>
                    </label>

                    <label class="radio-item">
                        <input type="radio" name="jenis" value="Akrilik Kubah Putih">
                        <span>Akrilik Kubah Putih</span>
                    </label>

                    <label class="radio-item">
                        <input type="radio" name="jenis" value="Akrilik Kubah Hitam">
                        <span>Akrilik Kubah Hitam</span>
                    </label>

                    <label class="radio-item">
                        <input type="radio" name="jenis" value="Akrilik Ring Besi">
                        <span>Akrilik Ring Besi</span>
                    </label>

                </div>

            </div>

            <!-- WARNA TULISAN -->

            <div class="form-group">

                <label class="required">
                    Request Warna Tulisan
                </label>

                <input
                    type="text"
                    id="warna"
                    placeholder="Contoh ; Hitam,Putih,Gold,Pink"
                >

            </div>

            <!-- SELENDANG -->

            <div class="form-group">

                <label>
                    Selendang
                </label>

                <div class="radio-inline">

                    <label>
                        <input type="radio" name="selendang" value="Pakai">
                        Pakai
                    </label>

                    <label>
                        <input type="radio" name="selendang" value="Tidak">
                        Tidak
                    </label>

                </div>

            </div>

            <!-- WARNA BUNGA -->

            <div class="form-group">

                <label>
                    Pilih beberapa opsi warna bunga
                </label>

                <div class="checkbox-grid">

                    <label><input type="checkbox" value="Merah"> Merah</label>

                    <label><input type="checkbox" value="Pink"> Pink</label>

                    <label><input type="checkbox" value="Biru"> Biru</label>

                    <label><input type="checkbox" value="Ungu"> Ungu</label>

                    <label><input type="checkbox" value="Putih"> Putih</label>

                    <label><input type="checkbox" value="Peach"> Peach</label>

                    <label><input type="checkbox" value="Kuning"> Kuning</label>

                    <label><input type="checkbox" value="Hijau"> Hijau</label>

                    <label><input type="checkbox" value="Coklat"> Coklat</label>

                    <label><input type="checkbox" value="Mix"> Mix</label>

                </div>

            </div>

            <!-- TANGGAL -->

            <div class="form-group">

                <label>
                    Pilih tanggal dan waktu Pengantaran
                </label>

                <div class="date-group">

                    <div>

                        <label class="small-label">
                            Pilih tanggal
                        </label>

                        <input type="date" id="tanggal">

                    </div>

                    <div>

                        <label class="small-label">
                            Pilih waktu
                        </label>

                        <input type="time" id="waktu">

                    </div>

                </div>

            </div>

            <!-- ALAMAT -->

            <div class="form-group">

                <label class="required">
                    Alamat Pengantaran / Gedung
                </label>

                <input
                    type="text"
                    id="alamat"
                    placeholder="Masukkan alamat lengkap"
                >

            </div>

            <!-- WHATSAPP -->

            <div class="form-group">

                <label class="required">
                    WhatsApp Pemesan
                </label>

                <input
                    type="tel"
                    id="whatsapp"
                    placeholder="08xxxxxxxxxx"
                >

            </div>

            <!-- EMOJI -->

            <div class="form-group">

                <label>
                    Request Emoji
                </label>

                <input
                    type="text"
                    id="emoji"
                    value=""
                >

            </div>

            <!-- BUTTON -->

            <div class="button-group">

                <button
                    type="button"
                    class="btn-preview"
                    onclick="previewPesanan()"
                >
                    Preview
                </button>

                <button
                    type="button"
                    class="btn-submit"
                    onclick="sendWhatsApp()"
                >
                    Kirim WhatsApp
                </button>

            </div>

        </form>

    </div>

    <!-- MODAL -->

    <div class="modal" id="modal">

        <div class="modal-content">

            <h2>Preview Pesanan</h2>

            <div id="previewContent"></div>

            <div class="button-group">

                <button
                    type="button"
                    class="btn-preview"
                    onclick="closeModal()"
                >
                    Tutup
                </button>

                <button
                    type="button"
                    class="btn-submit"
                    onclick="sendNow()"
                >
                    Kirim
                </button>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
